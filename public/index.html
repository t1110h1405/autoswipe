<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Auto Swipe 共有リンク管理</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card">
    <p class="eyebrow">AUTO SWIPE</p>
    <h1>共有リンク管理</h1>
    <p class="lead">ここで保存したリンクが、全端末のアプリ内と操作パネルに表示されます。</p>

    <section class="current" aria-labelledby="current-title">
        <h2 id="current-title">現在のリンク</h2>
        <a id="current-link" class="current-link" hidden target="_blank" rel="noopener noreferrer"></a>
        <p id="empty-message">まだリンクは設定されていません。</p>
        <p id="updated-at" class="muted"></p>
    </section>

    <section id="signed-out-panel">
        <button id="login-button" class="primary" type="button">Googleでログイン</button>
        <p class="muted">管理者アカウントだけが変更できます。</p>
    </section>

    <section id="admin-panel" hidden>
        <label for="url-input">送信するURL</label>
        <input id="url-input" type="url" inputmode="url" maxlength="2048"
               placeholder="https://example.com/" autocomplete="url">
        <div class="actions">
            <button id="save-button" class="primary" type="button">全端末に反映</button>
            <button id="clear-button" class="secondary" type="button">リンクを消す</button>
        </div>
        <div class="account-row">
            <span id="account-email" class="muted"></span>
            <button id="logout-button" class="text-button" type="button">ログアウト</button>
        </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
