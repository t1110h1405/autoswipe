plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def releaseStoreFile = System.getenv("AUTOSWIPE_KEYSTORE")
def releaseStorePassword = System.getenv("AUTOSWIPE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("AUTOSWIPE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("AUTOSWIPE_KEY_PASSWORD")

android {
    namespace "com.example.autoswipe"
    compileSdk 35

    signingConfigs {
        release {
            if (releaseStoreFile != null) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.example.autoswipe"
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName "1.0.12"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-database"
}
